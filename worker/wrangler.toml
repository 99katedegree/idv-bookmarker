name = "workers-idv-bookmarker"
main = "index.js"
compatibility_date = "2026-11-01"

# Cron でのみ動かすので、公開URLとプレビューURLは無効にする
workers_dev = false
preview_urls = false

# UTC 12:40 = JST 21:40（1日の区切りは 21:00。src/window.ts の DAY_START_HOUR_JST）
[triggers]
crons = ["40 12 * * *"]

[vars]
GITHUB_REPOSITORY = "99katedegree/idv-bookmarker"
WORKFLOW_FILE = "daily.yml"

# GITHUB_TOKEN は Secret として登録する（wrangler secret put GITHUB_TOKEN）
